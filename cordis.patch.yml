# 研研工具包：一个 bundle 挂载六条 loader 行 —— 自身元数据行 + 五个功能插件行。
# 每行 name 必须互不相同且恰好等于对应包的 package.json name，否则
# dsh-client-modules 会报 duplicate factory registration。
# 五个功能插件各有独立 id，安装后可由用户在插件页单独启停。
- insert:
    # 自身行：只承载健康检查路由与空 client 壳，不贡献任何 UI。
    - id: yanyan-toolkit-compat
      name: 'dsh-plugin-yanyan-toolkit'

    # 插件一「插件更新」：检查本地插件与线上插件版本，逐个更新。
    - id: dsh-plugin-yanyan-update
      name: 'dsh-plugin-yanyan-update'
      config:
        checkOnOpen: false
        includeLocal: true
        includeRegistry: true

    # 插件二「子智能体管理」：会话顶部标签 + 行尾删除 + 清理全部空闲 + 自动清理。
    - id: dsh-plugin-yanyan-subagent
      name: 'dsh-plugin-yanyan-subagent'
      config:
        tabLabel: '智能体管理'
        autoCleanEnabled: true
        idleMinutes: 30
        checkIntervalMin: 10

    # 插件三「图标生成」：上传图片居中裁切、生成适配插件列表图标位的 icon.svg。
    - id: dsh-plugin-yanyan-icon
      name: 'dsh-plugin-yanyan-icon'
      config:
        radius: 13
        padding: 3
        borderWidth: 1

    # 插件四「会话管理中心」：Phase 1 交付旁路元数据（session-metadata.json），
    # 三栏布局（左导航/中列表/右详情）+ 新建文件夹/移入文件夹/标签增删，全部
    # 只写独立账本，绝不改动 DSH 原生会话文件。settings.section order=27。
    # 原独立回收站子包（dsh-plugin-yanyan-trash）能力已完整融入本插件的「回收站」tab，
    # 故子包已删除；Host 半四个纯函数模块 lib/session-{trash,purge,cascade,snapshot}.js 仍由此复用。
    # 第三方 @linxin666/dsh-session-archive 已于 1.4.13 彻底剔除；会话管理全部由
    # 本插件自持（含归档/删除/回收站），不再依赖任何外部归档包。
    - id: dsh-plugin-yanyan-session-hub
      name: 'dsh-plugin-yanyan-session-hub'

    # 插件五「找对插件」：纯 host 工具插件，给 agent 注册 find_dsh_plugins 工具，
    # 聚合整个 DSH 插件生态按 相关度×可信度×新鲜度×热度 排序，主推 1 个 + 少量备选。
    # 无 client 半区、无 config，name 必须严格等于子包 package.json 的 name。
    - id: dsh-find-right-plugin
      name: 'dsh-find-right-plugin'
